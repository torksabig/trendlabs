name: TrendLab scheduled research

on:
  schedule:
    # Every weekday hour during US market session (approx). Free-tier Actions limits apply.
    - cron: "20 14-21 * * 1-5"
  workflow_dispatch:

jobs:
  collect-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/requirements.txt

      - name: Collect market data
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
        run: |
          cd workers
          python -m trendlabs.collect --timeframe 1h

      - name: Run paper simulation
        run: |
          cd workers
          python -m trendlabs.simulate --timeframe 1h

      - name: Commit snapshot for dashboard
        run: |
          git config user.name "trendlabs-bot"
          git config user.email "trendlabs-bot@users.noreply.github.com"
          git add data/snapshots/latest.json public/data/snapshot.json || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: refresh TrendLab market snapshot"
            git push
          fi
