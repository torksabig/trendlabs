name: TrendLab scheduled research

on:
  schedule:
    # Every weekday hour during US market session (approx). Free-tier Actions limits apply.
    - cron: "20 14-21 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Worker job to run"
        required: true
        default: "simulate"
        type: choice
        options:
          - seed
          - collect
          - simulate
          - research
          - scheduled
      symbol:
        description: "Symbol for collect / research / seed"
        required: false
        default: "AAPL"
        type: string
      timeframe:
        description: "Candle timeframe"
        required: false
        default: "1h"
        type: string

permissions:
  contents: write

jobs:
  collect-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/requirements.txt

      - name: Resolve job inputs
        id: job
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=scheduled" >> "$GITHUB_OUTPUT"
            echo "symbol=AAPL" >> "$GITHUB_OUTPUT"
            echo "timeframe=1h" >> "$GITHUB_OUTPUT"
          else
            JOB="${{ inputs.job }}"
            SYMBOL="${{ inputs.symbol }}"
            TF="${{ inputs.timeframe }}"
            echo "name=${JOB:-scheduled}" >> "$GITHUB_OUTPUT"
            echo "symbol=${SYMBOL:-AAPL}" >> "$GITHUB_OUTPUT"
            echo "timeframe=${TF:-1h}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect market data (scheduled)
        if: steps.job.outputs.name == 'scheduled'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
        run: |
          cd workers
          python -m trendlabs.collect --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Run paper simulation (scheduled)
        if: steps.job.outputs.name == 'scheduled'
        run: |
          cd workers
          python -m trendlabs.simulate --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Seed (collect + simulate + research)
        if: steps.job.outputs.name == 'seed'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
        run: |
          cd workers
          python -m trendlabs.seed \
            --timeframe "${{ steps.job.outputs.timeframe }}" \
            --research-symbol "${{ steps.job.outputs.symbol }}" \
            --no-ollama

      - name: Collect market data
        if: steps.job.outputs.name == 'collect'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
        run: |
          cd workers
          python -m trendlabs.collect \
            --timeframe "${{ steps.job.outputs.timeframe }}" \
            --symbols "${{ steps.job.outputs.symbol }}"

      - name: Run paper simulation
        if: steps.job.outputs.name == 'simulate'
        run: |
          cd workers
          python -m trendlabs.simulate --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Daily research report
        if: steps.job.outputs.name == 'research'
        run: |
          cd workers
          python -m trendlabs.research \
            --symbol "${{ steps.job.outputs.symbol }}" \
            --timeframe "${{ steps.job.outputs.timeframe }}" \
            --no-ollama

      - name: Commit snapshot for dashboard
        run: |
          git config user.name "trendlabs-bot"
          git config user.email "trendlabs-bot@users.noreply.github.com"
          git add data/snapshots/latest.json public/data/snapshot.json || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: refresh TrendLab market snapshot (${{ steps.job.outputs.name }})"
            git push
          fi
