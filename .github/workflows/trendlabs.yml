name: TrendLab scheduled research

on:
  schedule:
    # Every weekday hour during US market session (approx). Free-tier Actions limits apply.
    - cron: "20 14-21 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Worker job to run"
        required: true
        default: "simulate"
        type: choice
        options:
          - seed
          - collect
          - simulate
          - research
          - scheduled
      symbol:
        description: "Symbol for collect / research / seed"
        required: false
        default: "AAPL"
        type: string
      timeframe:
        description: "Candle timeframe"
        required: false
        default: "1h"
        type: string
      provider:
        description: "Research LLM provider (auto tries free cloud keys, then fallback)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - google
          - groq
          - openrouter
          - cloudflare
          - cerebras
          - mistral
          - ollama
          - fallback
      model:
        description: "Optional model override for the selected provider"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  collect-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/requirements.txt

      - name: Resolve job inputs
        id: job
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=scheduled" >> "$GITHUB_OUTPUT"
            echo "symbol=AAPL" >> "$GITHUB_OUTPUT"
            echo "timeframe=1h" >> "$GITHUB_OUTPUT"
            echo "provider=auto" >> "$GITHUB_OUTPUT"
            echo "model=" >> "$GITHUB_OUTPUT"
          else
            JOB="${{ inputs.job }}"
            SYMBOL="${{ inputs.symbol }}"
            TF="${{ inputs.timeframe }}"
            PROVIDER="${{ inputs.provider }}"
            MODEL="${{ inputs.model }}"
            echo "name=${JOB:-scheduled}" >> "$GITHUB_OUTPUT"
            echo "symbol=${SYMBOL:-AAPL}" >> "$GITHUB_OUTPUT"
            echo "timeframe=${TF:-1h}" >> "$GITHUB_OUTPUT"
            echo "provider=${PROVIDER:-auto}" >> "$GITHUB_OUTPUT"
            echo "model=${MODEL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect market data (scheduled)
        if: steps.job.outputs.name == 'scheduled'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
        run: |
          cd workers
          python -m trendlabs.collect --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Run paper simulation (scheduled)
        if: steps.job.outputs.name == 'scheduled'
        run: |
          cd workers
          python -m trendlabs.simulate --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Seed (collect + simulate + research)
        if: steps.job.outputs.name == 'seed'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
          TRENDLAB_LLM_PROVIDER: ${{ steps.job.outputs.provider }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cd workers
          ARGS=(
            --timeframe "${{ steps.job.outputs.timeframe }}"
            --research-symbol "${{ steps.job.outputs.symbol }}"
            --no-ollama
          )
          if [ -n "${{ steps.job.outputs.provider }}" ] && [ "${{ steps.job.outputs.provider }}" != "auto" ]; then
            ARGS+=(--provider "${{ steps.job.outputs.provider }}")
          fi
          if [ -n "${{ steps.job.outputs.model }}" ]; then
            ARGS+=(--model "${{ steps.job.outputs.model }}")
          fi
          python -m trendlabs.seed "${ARGS[@]}"

      - name: Collect market data
        if: steps.job.outputs.name == 'collect'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_FEED: iex
        run: |
          # Always refresh the full 12-symbol universe. A single-symbol collect on a
          # clean runner DB would otherwise overwrite public/data/snapshot.json with
          # one market and break the dashboard for every other ticker.
          cd workers
          echo "Focus symbol (UI): ${{ steps.job.outputs.symbol }}"
          python -m trendlabs.collect --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Run paper simulation
        if: steps.job.outputs.name == 'simulate'
        run: |
          cd workers
          python -m trendlabs.simulate --timeframe "${{ steps.job.outputs.timeframe }}"

      - name: Daily research report
        if: steps.job.outputs.name == 'research'
        env:
          TRENDLAB_LLM_PROVIDER: ${{ steps.job.outputs.provider }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cd workers
          # Ensure candles exist for research symbol + keep full snapshot universe.
          python -m trendlabs.collect --timeframe "${{ steps.job.outputs.timeframe }}"
          ARGS=(
            --symbol "${{ steps.job.outputs.symbol }}"
            --timeframe "${{ steps.job.outputs.timeframe }}"
            --no-ollama
          )
          if [ -n "${{ steps.job.outputs.provider }}" ] && [ "${{ steps.job.outputs.provider }}" != "auto" ]; then
            ARGS+=(--provider "${{ steps.job.outputs.provider }}")
          fi
          if [ -n "${{ steps.job.outputs.model }}" ]; then
            ARGS+=(--model "${{ steps.job.outputs.model }}")
          fi
          python -m trendlabs.research "${ARGS[@]}"

      - name: Commit snapshot for dashboard
        run: |
          git config user.name "trendlabs-bot"
          git config user.email "trendlabs-bot@users.noreply.github.com"
          git add data/snapshots/latest.json public/data/snapshot.json || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: refresh TrendLab market snapshot (${{ steps.job.outputs.name }})"
          # Concurrent Arena dispatches can race; rebase and retry push.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed snapshot on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main…"
            git pull --rebase origin main
          done
          echo "Failed to push snapshot after retries" >&2
          exit 1
