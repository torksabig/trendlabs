name: Write db.py once
on:
  push:
    paths:
      - ".github/write-db.flag"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit db.py
        run: |
          python3 -c "import base64,gzip,pathlib; pathlib.Path('workers/trendlabs/db.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('.github/db.py.b64gz').read_text().strip()))); print('ok', pathlib.Path('workers/trendlabs/db.py').stat().st_size)"
          git config user.name "trendlabs-bot"
          git config user.email "trendlabs-bot@users.noreply.github.com"
          git add workers/trendlabs/db.py
          git commit -m "feat(extract): sync batch 5 - real db.py" || exit 0
          git push
