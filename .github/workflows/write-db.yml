name: Write db.py once
on:
  push:
    paths:
      - ".github/write-db.flag"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit db.py
        env:
          HX0: ""
          HX4: ""
        run: |
          python3 -c "import os,pathlib; pathlib.Path('.github/db-b64/00').write_text(bytes.fromhex(os.environ['HX0']).decode()); pathlib.Path('.github/db-b64/04').write_text(bytes.fromhex(os.environ['HX4']).decode())"
          python3 -c "import base64,gzip,pathlib; b64=''.join(pathlib.Path(f'.github/db-b64/{i:02d}').read_text().strip() for i in range(13)); pathlib.Path('workers/trendlabs/db.py').write_bytes(gzip.decompress(base64.b64decode(b64))); print('ok', pathlib.Path('workers/trendlabs/db.py').stat().st_size)"
          git config user.name "trendlabs-bot"
          git config user.email "trendlabs-bot@users.noreply.github.com"
          git add workers/trendlabs/db.py
          git commit -m "feat(extract): sync batch 5 - real db.py" || exit 0
          git push
